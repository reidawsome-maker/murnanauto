<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murnan Auto | Platform Catalog</title>
  <link rel="stylesheet" href="style.css"> <!-- Your existing stylesheet -->
  <style>
    .filter-bar { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
    .category-btn { padding: 8px 16px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; border-radius: 4px; }
    .category-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
    .search-input { padding: 8px 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; flex-grow: 1; max-width: 300px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: #181818; border: 1px solid #282828; padding: 15px; border-radius: 6px; position: relative; }
    .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
    .badge-save { position: absolute; top: 10px; right: 10px; background: #e63946; color: white; padding: 3px 8px; font-size: 12px; border-radius: 3px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <!-- Your existing Header/Nav -->
    <h1 id="platform-title" style="text-transform: uppercase;">Loading Platform...</h1>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    
    <!-- Dynamic Filter and Search Bar -->
    <div class="filter-bar">
      <input type="text" id="search-bar" class="search-input" placeholder="Search by SKU or part name..." onkeyup="filterProducts()">
      <div id="category-pills" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>

    <!-- Organized Product Grid -->
    <div id="product-grid" class="product-grid"></div>

  </main>

  <script>
    let allProducts = [];
    let currentCategory = 'ALL';
    
    // 1. Get vehicle platform from URL (e.g. platform.html?car=mustang)
    const urlParams = new URLSearchParams(window.location.search);
    const targetCar = urlParams.get('car') ? urlParams.get('car').toLowerCase() : 'universal';

    document.getElementById('platform-title').innerText = targetCar.toUpperCase() + " PERFORMANCE PARTS";

    // 2. Fetch inventory file
    async function loadCatalog() {
      try {
        const response = await fetch('inventory.json'); // Pulls master store inventory
        const data = await response.json();
        
        // Filter parts assigned to this platform (or universal parts)
        allProducts = data.filter(item => {
          const itemPlatform = (item.platform || '').toLowerCase();
          return itemPlatform === targetCar || itemPlatform === 'universal';
        });

        buildCategoryPills();
        renderGrid();
      } catch (err) {
        console.error("Error loading product catalog", err);
      }
    }

    // 3. Build filter pills automatically based on available products
    function buildCategoryPills() {
      const categories = ['ALL', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const pillsContainer = document.getElementById('category-pills');
      
      pillsContainer.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === 'ALL' ? 'active' : ''}" onclick="selectCategory('${cat}', this)">
          ${cat}
        </button>
      `).join('');
    }

    // 4. Handle Category Pill Clicks
    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterProducts();
    }

    // 5. Filter & Search Execution
    function filterProducts() {
      const searchTerm = document.getElementById('search-bar').value.toLowerCase();
      
      const filtered = allProducts.filter(item => {
        const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(searchTerm) || (item.sku && item.sku.toLowerCase().includes(searchTerm));
        return matchesCategory && matchesSearch;
      });

      renderGrid(filtered);
    }

    // 6. Render Product Cards
    function renderGrid(productsToRender = allProducts) {
      const grid = document.getElementById('product-grid');
      
      if (productsToRender.length === 0) {
        grid.innerHTML = '<p style="color: #888;">No parts found matching your selection.</p>';
        return;
      }

      grid.innerHTML = productsToRender.map(item => {
        const savings = (item.compare_price && item.compare_price > item.price) 
          ? `<span class="badge-save">Save $${(item.compare_price - item.price).toFixed(2)}</span>` 
          : '';

        return `
          <div class="product-card">
            ${savings}
            <img src="${item.image || 'placeholder.jpg'}" alt="${item.title}">
            <p style="font-size: 12px; color: #888; margin: 5px 0;">SKU: ${item.sku || 'N/A'}</p>
            <h3 style="font-size: 16px; margin: 5px 0;">${item.title}</h3>
            <p style="font-size: 18px; color: #00ffcc; font-weight: bold;">$${Number(item.price).toFixed(2)}</p>
            <button onclick="addToCart('${item.sku}')" style="width: 100%; padding: 8px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">Add to Cart</button>
          </div>
        `;
      }).join('');
    }

    loadCatalog();
  </script>
</body>
</html>
