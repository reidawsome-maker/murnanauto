name: Compile CMS Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'content/products/**'

permissions:
  contents: write

jobs:
  build-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge CMS Products into inventory.json
        run: |
          python -c "
          import os, json

          products = []
          folder = 'content/products'

          if os.path.exists(folder):
              for file in os.listdir(folder):
                  if file.endswith('.json'):
                      path = os.path.join(folder, file)
                      try:
                          with open(path, 'r') as f:
                              products.append(json.load(f))
                      except Exception as e:
                          print(f'Error reading {file}: {e}')

          with open('inventory.json', 'w') as f:
              json.dump(products, f, indent=2)

          print(f'Successfully compiled {len(products)} CMS products into inventory.json')
          "

      - name: Commit Updated inventory.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile CMS inventory.json"
          file_pattern: "inventory.json"
