<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murnan Auto — Parts, Tools, Merch &amp; Supplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  #cart-overlay {
    position: fixed; top: 0; right: -400px; width: 380px; height: 100vh;
    background: var(--panel-2, #181b20); border-left: 1px solid var(--steel, #333);
    box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 9999; transition: right 0.3s ease;
    padding: 24px; box-sizing: border-box; display: flex; flex-direction: column;
  }
  #cart-overlay.open { right: 0; }
  .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--steel, #333); padding-bottom: 12px; }
  .cart-items { flex: 1; overflow-y: auto; margin: 20px 0; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed var(--steel, #333); padding-bottom: 12px; }
  .cart-footer { border-top: 1px solid var(--steel, #333); padding-top: 16px; }

  .trust-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
    background: var(--panel-2, #181b20); border-top: 1px solid var(--steel, #333); border-bottom: 1px solid var(--steel, #333);
    padding: 16px 5vw;
  }
  .trust-item { display: flex; align-items: center; gap: 12px; }
  .trust-icon { font-size: 1.5rem; line-height: 1; }
  .trust-text h4 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 0.95rem; text-transform: uppercase; color: var(--paper, #fff); }
  .trust-text p { margin: 2px 0 0 0; font-size: 0.78rem; color: var(--paper-dim, #888); }

  .subcat-pill.active-pill { background: var(--blue-bright) !important; color: #000 !important; font-weight: 700; }
  .subcat-pill { cursor: pointer; }

  #category-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; width: 100%; }
  .live-prod-card { background: var(--panel-2); border: 1px solid var(--steel); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 6px; }
  .live-prod-sku { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--blue-bright); }
  .live-prod-name { font-family: 'Oswald', sans-serif; margin: 6px 0; color: var(--paper); font-size: 1rem; text-transform: none; letter-spacing: 0; }
  .live-prod-price { font-weight: 700; color: var(--paper); font-size: 1.1rem; margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .save-tag-sm { background: rgba(255, 92, 92, 0.15); color: #ff5c5c; border: 1px solid #ff5c5c; font-family: 'Oswald', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
  .live-prod-stock { font-size: 0.75rem; margin-bottom: 12px; font-weight: 600; }
  .live-prod-btn { width: 100%; padding: 10px; background: var(--blue); color: var(--asphalt); border: none; border-radius: 4px; font-family: 'Oswald', sans-serif; font-size: 0.8rem; text-transform: uppercase; font-weight:600; cursor: pointer; }
  .live-prod-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* SEARCH BAR STYLING */
  .search-wrap { margin-bottom: 24px; position: relative; max-width: 600px; }
  .search-input {
    width: 100%; padding: 14px 18px 14px 44px; background: var(--panel-2); border: 1px solid var(--steel);
    color: var(--paper); font-family: 'Inter', sans-serif; font-size: 0.95rem; border-radius: 6px; box-sizing: border-box;
  }
  .search-input:focus { border-color: var(--blue-bright); outline: none; }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--paper-dim); font-size: 1rem; }
</style>
</head>
<body>

<nav>
  <div class="logo"><a href="index.html" style="color:inherit; text-decoration:none;">MURNAN <span>AUTO</span></a></div>
  <ul class="cat-nav" style="display:flex; align-items:center;">
    <li><a href="#fitment">Platforms</a></li>
    <li><a href="#shop">Shop</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="javascript:void(0)" onclick="toggleInquiryModal(true)">Contact</a></li>
    <li>
      <button onclick="toggleCart()" style="background:var(--steel); border:1px solid var(--paper-dim); color:var(--paper); padding:6px 14px; font-family:'JetBrains Mono',monospace; font-size:0.8rem; text-transform:uppercase; cursor:pointer;">
        Cart (<span id="cart-count">0</span>)
      </button>
    </li>
  </ul>
</nav>

<div id="cart-overlay">
  <div class="cart-header">
    <h3 style="margin:0; font-family:'Oswald',sans-serif; text-transform:uppercase;">Your Cart</h3>
    <button onclick="toggleCart()" style="background:none; border:none; color:var(--paper); font-size:1.5rem; cursor:pointer;">&times;</button>
  </div>
  <div class="cart-items" id="cart-items-list">
    <p style="color:var(--paper-dim); text-align:center; margin-top:40px;">Your cart is empty.</p>
  </div>
  <div class="cart-footer">
    <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--paper-dim); margin-bottom:6px;">
      <span>Estimated Freight:</span>
      <span id="cart-shipping">$0.00</span>
    </div>
    <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; margin-bottom:16px;">
      <span>Total:</span>
      <span id="cart-total">$0.00</span>
    </div>
    <button id="cart-checkout-btn" onclick="processCheckout()" style="display:block; width:100%; padding:12px; background:var(--blue); color:var(--asphalt); text-align:center; font-weight:700; text-transform:uppercase; box-sizing:border-box; border:none; border-radius:5px; cursor:pointer; font-family:'Oswald',sans-serif;">
      Proceed to Checkout
    </button>
  </div>
</div>

<section id="shop" style="padding-top: 40px;">
  <div class="section-head">
    <h2>Catalog Search &amp; Categories</h2>
    <span class="sub" id="catCount">12 CATEGORIES</span>
  </div>

  <!-- GLOBAL SEARCH INPUT BAR -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="global-search" class="search-input" placeholder="Search by AN size, fitting degree, SKU, or part name (e.g. -6AN 90 degree)..." oninput="handleGlobalSearch(this.value)">
  </div>

  <div class="cat-grid-lg" id="catGridLg"></div>

  <div class="subcat-panel" id="subcatPanel">
    <div class="subcat-head">
      <h3 id="subcatTitle"></h3>
      <button class="subcat-close" id="subcatClose">Close &times;</button>
    </div>
    <div class="subcat-pills" id="subcatPills"></div>

    <!-- DYNAMIC AN SIZE SUB-PILLS CONTAINER -->
    <div id="sizeSubPills" style="display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--steel); padding-top: 12px; align-items: center;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--blue-bright); text-transform: uppercase;">Select Size:</span>
      <span class="subcat-pill active-pill" onclick="filterAnSize('ALL', this)">All Sizes</span>
      <span class="subcat-pill" onclick="filterAnSize('6AN', this)">-6 AN</span>
      <span class="subcat-pill" onclick="filterAnSize('8AN', this)">-8 AN</span>
      <span class="subcat-pill" onclick="filterAnSize('10AN', this)">-10 AN</span>
    </div>
  </div>
</section>

<footer>
  <div>© 2026 Murnan Auto</div>
  <div><a href="mailto:support@murnanauto.store">support@murnanauto.store</a> · murnanauto.store</div>
</footer>

<script src="cart.js"></script>
<script>
  let activeCategoryKey = '';
  let activeSubcatLabel = '';
  let activeAnSizeFilter = 'ALL';
  let searchQuery = '';

  const categories = [
    { name: "Fuel System & AN Hardware", img: "fuel.jpg", subs: [
      { label: "AN Hose Ends & Fittings", match: "ANFittings", hasSizes: true },
      { label: "AN Adapters & Specialty", match: "ANAdapters", hasSizes: true },
      { label: "PTFE Hose & Lines", match: "PTFEHose", hasSizes: true },
      { label: "Nylon Braided Hose", match: "NylonHose", hasSizes: true },
      { label: "Hose Separators & Clamps", match: "HoseClamps", hasSizes: true },
      { label: "Fuel Filters", match: "FuelFilters" }
    ]},
    { name: "Tools", img: "tools.jpg", subs: [
      { label: "Hand Tools & Specialty", match: "Tools" }
    ]}
  ];

  const catGridLg = document.getElementById('catGridLg');
  const subcatPanel = document.getElementById('subcatPanel');
  const subcatTitle = document.getElementById('subcatTitle');
  const subcatPills = document.getElementById('subcatPills');
  const sizeSubPills = document.getElementById('sizeSubPills');

  categories.forEach((cat) => {
    const card = document.createElement('button');
    card.className = 'cat-card-lg';
    card.style.backgroundImage = `url('${cat.img}')`;
    card.innerHTML = `<h3>${cat.name}</h3>`;
    card.addEventListener('click', () => {
      document.querySelectorAll('.cat-card-lg').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      subcatTitle.textContent = cat.name;
      
      subcatPills.innerHTML = cat.subs.map((s, index) =>
        `<span class="subcat-pill ${index === 0 ? 'active-pill' : ''}" onclick="filterCategoryProducts('${s.match}', '${s.label}', this, ${s.hasSizes || false})">${s.label}</span>`
      ).join('');
      
      subcatPanel.classList.add('open');
      subcatPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
      if (cat.subs.length > 0) {
        const firstPill = subcatPills.querySelector('.subcat-pill');
        filterCategoryProducts(cat.subs[0].match, cat.subs[0].label, firstPill, cat.subs[0].hasSizes || false);
      }
    });
    catGridLg.appendChild(card);
  });

  document.getElementById('subcatClose').addEventListener('click', () => {
    subcatPanel.classList.remove('open');
    document.querySelectorAll('.cat-card-lg').forEach(c => c.classList.remove('active'));
  });

  function handleGlobalSearch(query) {
    searchQuery = query.toLowerCase().trim();
    if (searchQuery.length > 0 && !subcatPanel.classList.contains('open')) {
      subcatPanel.classList.add('open');
      subcatTitle.textContent = "Search Results";
    }
    renderFilteredGrid();
  }

  function filterCategoryProducts(categoryKey, subcatLabel, pillElem, showSizeBar = false) {
    if (pillElem) {
      document.querySelectorAll('#subcatPills .subcat-pill').forEach(p => p.classList.remove('active-pill'));
      pillElem.classList.add('active-pill');
    }

    activeCategoryKey = categoryKey;
    activeSubcatLabel = subcatLabel;
    activeAnSizeFilter = 'ALL';

    if (sizeSubPills) {
      sizeSubPills.style.display = showSizeBar ? 'flex' : 'none';
      sizeSubPills.querySelectorAll('.subcat-pill').forEach((p, idx) => {
        if (idx === 0) p.classList.add('active-pill');
        else p.classList.remove('active-pill');
      });
    }

    renderFilteredGrid();
  }

  function filterAnSize(sizeLabel, pillElem) {
    if (pillElem) {
      sizeSubPills.querySelectorAll('.subcat-pill').forEach(p => p.classList.remove('active-pill'));
      pillElem.classList.add('active-pill');
    }
    activeAnSizeFilter = sizeLabel;
    renderFilteredGrid();
  }

  function renderFilteredGrid() {
    let container = document.getElementById('category-products-grid');
    if (!container) {
      container = document.createElement('div');
      container.id = 'category-products-grid';
      subcatPanel.appendChild(container);
    }

    if (!window.inventory || window.inventory.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: var(--paper-dim);">Loading inventory...</div>`;
      return;
    }

    const targetKey = activeCategoryKey.toLowerCase().trim();
    const targetLabel = activeSubcatLabel.toLowerCase().trim();

    const filtered = inventory.filter(p => {
      const pCat = (p.category || '').toLowerCase().trim();
      const pSubcat = (p.subcategory || '').toLowerCase().trim();
      const pName = (p.name || p.title || '').toLowerCase().trim();
      const pSku = (p.sku || '').toLowerCase().trim();

      // Search Query Override
      if (searchQuery.length > 0) {
        return pName.includes(searchQuery) || pSku.includes(searchQuery) || pCat.includes(searchQuery);
      }

      // Category matching
      let matchesCategory = false;
      if (pCat === targetKey || pSubcat === targetLabel) {
        matchesCategory = true;
      } else if (targetKey === 'anfittings' && (pCat.includes('fitting') || pCat === 'lines')) {
        matchesCategory = true;
      } else if (targetKey === 'anadapters' && (pCat.includes('adapter') || pCat.includes('union'))) {
        matchesCategory = true;
      } else if (targetKey === 'ptfehose' && pCat === 'ptfehose') {
        matchesCategory = true;
      } else if (targetKey === 'nylonhose' && pCat === 'nylonhose') {
        matchesCategory = true;
      } else if (targetKey === 'hoseclamps' && pCat === 'hoseclamps') {
        matchesCategory = true;
      } else if (targetKey === 'tools' && pCat === 'tools') {
        matchesCategory = true;
      }

      if (!matchesCategory) return false;

      // Size matching
      if (activeAnSizeFilter !== 'ALL') {
        const prodSize = (p.anSize || '').toUpperCase().replace('-', '').trim();
        const targetSize = activeAnSizeFilter.toUpperCase().replace('-', '').trim();
        const nameHasSize = pName.includes(`-${targetSize.toLowerCase()}`) || pName.includes(` ${targetSize.toLowerCase()}`);
        if (prodSize !== targetSize && !nameHasSize) return false;
      }

      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: var(--paper-dim);">No parts matched your criteria.</div>`;
      return;
    }

    container.innerHTML = filtered.map(item => {
      const hasVariants = item.variants && item.variants.length > 0;
      const displayPrice = hasVariants ? `From $${item.price.toFixed(2)}` : `$${item.price.toFixed(2)}`;
      const imgSrc = item.image || item.featured_image || (item.images && item.images[0]);
      const titleText = item.title || item.name;

      let colorPillsHtml = '';
      if (hasVariants) {
        const colors = [...new Set(item.variants.map(v => v.name))];
        if (colors.length > 1) {
          colorPillsHtml = `<div style="font-size:0.7rem; color:var(--blue-bright); margin-bottom:8px;">${colors.length} COLORS AVAILABLE</div>`;
        }
      }

      return `
        <div class="live-prod-card">
          <div>
            ${imgSrc ? `<img src="${imgSrc}" alt="${titleText}" style="width:100%; aspect-ratio:1/1; object-fit:contain; background:var(--panel); border-radius:4px; margin-bottom:10px;">` : ''}
            <span class="live-prod-sku">${item.sku || item.id}</span>
            <h4 class="live-prod-name"><a href="product.html?id=${item.id}" style="color:inherit; text-decoration:none;">${titleText}</a></h4>
            ${colorPillsHtml}
            <div class="live-prod-price">${displayPrice}</div>
          </div>
          <div style="display:flex; gap:8px;">
            <a href="product.html?id=${item.id}" class="live-prod-btn" style="text-decoration:none; text-align:center;">View Part</a>
          </div>
        </div>`;
    }).join('');
  }

  loadInventory().then(updateCartUI);
</script>
</body>
</html>
