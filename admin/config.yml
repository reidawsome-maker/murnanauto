backend:
  name: github
  repo: reidawsome-maker/murnanauto
  branch: main
  base_url: https://decap-oauth.murnanauto.workers.dev
  auth_endpoint: auth

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Product Title", name: "title", widget: "string" }
      - { label: "SKU / Part Number", name: "sku", widget: "string" }
      - { label: "Price ($ MAP)", name: "price", widget: "number", value_type: "float" }
      - { label: "Compare Price ($ Racer/MSRP)", name: "compare_price", widget: "number", value_type: "float", required: false }
      - { label: "Wholesale Cost ($ P1)", name: "cost", widget: "number", value_type: "float", required: false }
      
      # Item Weight Field (Crucial for Shipping Calculations)
      - { label: "Item Weight (lbs)", name: "weight", widget: "number", value_type: "float", default: 0 }
      
      - { label: "In Stock Count", name: "stock", widget: "number", default: 1 }
      
      # Category selection dropdown
      - label: "Category / Subcategory"
        name: "category"
        widget: "select"
        options:
          # Forced Induction & Nitrous
          - { label: "Forced Induction — Turbochargers", value: "Turbos" }
          - { label: "Forced Induction — Intercoolers & Piping", value: "Intercoolers" }
          - { label: "Forced Induction — Turbo Kits", value: "Kits" }
          - { label: "Forced Induction — Superchargers", value: "Superchargers" }
          - { label: "Forced Induction — Nitrous Kits & Bottles", value: "Nitrous" }
          - { label: "Forced Induction — Boost Controllers", value: "Controllers" }
          - { label: "Forced Induction — Wastegates & BOVs", value: "Valves" }
          
          # Engine
          - { label: "Engine — Pistons & Rings", value: "Pistons" }
          - { label: "Engine — Connecting Rods", value: "Rods" }
          - { label: "Engine — Camshafts & Valvetrain", value: "Camshafts" }
          - { label: "Engine — Gaskets & Seals", value: "Gaskets" }
          - { label: "Engine — Rebuild Kits", value: "Rebuild" }
          - { label: "Engine — Oil Pumps & Pans", value: "Oil" }
          
          # Exhaust
          - { label: "Exhaust — Headers & Manifolds", value: "Headers" }
          - { label: "Exhaust — Cat-Back Systems", value: "Exhaust" }
          - { label: "Exhaust — Downpipes & Midpipes", value: "Downpipes" }
          - { label: "Exhaust — Mufflers & Resonators", value: "Mufflers" }
          - { label: "Exhaust — Exhaust Tips", value: "Tips" }
          
          # Fuel System (Granular Breakdown)
          - { label: "Fuel System — Complete Fuel Kits", value: "FuelKits" }
          - { label: "Fuel System — AN Hose Ends & Swivel Fittings", value: "ANFittings" }
          - { label: "Fuel System — PTFE Hose & Lines", value: "PTFEHose" }
          - { label: "Fuel System — Nylon & Stainless Braided Hose", value: "NylonHose" }
          - { label: "Fuel System — Hose Separators & Clamps", value: "HoseClamps" }
          - { label: "Fuel System — AN Adapters & NPT Fittings", value: "ANAdapters" }
          - { label: "Fuel System — Fuel Pumps & Components", value: "Pumps" }
          - { label: "Fuel System — Fuel Injectors", value: "Injectors" }
          - { label: "Fuel System — Fuel Rails & Regulators", value: "Regulators" }
          - { label: "Fuel System — Fuel Filters", value: "FuelFilters" }
          
          # Ignition & Electrical
          - { label: "Ignition & Electrical — Ignition Coils", value: "Coils" }
          - { label: "Ignition & Electrical — Spark Plugs", value: "Plugs" }
          - { label: "Ignition & Electrical — Wiring & Harnesses", value: "Wiring" }
          
          # Fluids & Chemicals 
          - { label: "Fluids & Chemicals — Motor & Engine Oils", value: "EngineOils" }
          - { label: "Fluids & Chemicals — Transmission & Gear Oils", value: "GearOils" }
          - { label: "Fluids & Chemicals — Brake Fluids", value: "BrakeFluids" }
          - { label: "Fluids & Chemicals — Coolants & Additives", value: "Coolants" }
          - { label: "Fluids & Chemicals — Washing & Detailing", value: "Washing"
          
          # Drivetrain
          - { label: "Drivetrain — Clutches & Flywheels", value: "Clutches" }
          - { label: "Drivetrain — Axles & Driveshafts", value: "Axles" }
          - { label: "Drivetrain — Differentials & Gears", value: "Differentials" }
          
          # Brakes
          - { label: "Brakes — Brake Pads", value: "Pads" }
          - { label: "Brakes — Rotors", value: "Rotors" }
          - { label: "Brakes — Big Brake Kits & Calipers", value: "Calipers" }
          
          # Cooling
          - { label: "Cooling — Radiators", value: "Radiators" }
          - { label: "Cooling — Oil Coolers", value: "OilCoolers" }
          - { label: "Cooling — Fans & Shrouds", value: "Fans" }
          - { label: "Cooling — Thermostats", value: "Thermostats" }
          
          # Interior & Electronics
          - { label: "Interior — Gauges & Pods", value: "Gauges" }
          - { label: "Interior — Digital Dashes & Monitors", value: "Monitors" }
          - { label: "Interior — Switches, Wiring & Accessories", value: "InteriorAcc" }

          # Tools
          - { label: "Tools — Hand Tools & Specialty Equipment", value: "Tools" }
          - { label: "Tools — Shop Fluids & Chemicals", value: "Fluids" }

          # Merch
          - { label: "Merch — Branded Apparel & Gear", value: "Merch" }

      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "markdown" }

      # Product Variants Section
      - label: "Product Variants (Optional)"
        name: "variants"
        widget: "list"
        required: false
        fields:
          - { label: "Variant Option Name (e.g., Black Calipers / Drilled Rotor)", name: "option", widget: "string" }
          - { label: "Variant SKU", name: "sku", widget: "string" }
          - { label: "Variant Price ($)", name: "price", widget: "number", value_type: "float" }
          - { label: "Variant Weight (lbs)", name: "weight", widget: "number", value_type: "float", default: 0 }
          - { label: "Variant Stock Count", name: "stock", widget: "number", default: 10 }
