<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — Murnan Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .product-page-container {
    max-width: 1200px; margin: 20px auto 60px; padding: 0 5vw;
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  }
  @media (max-width: 768px) {
    .product-page-container { grid-template-columns: 1fr; }
  }
  .back-nav-bar { max-width: 1200px; margin: 20px auto 0; padding: 0 5vw; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2, #181b20);
    border: 1px solid var(--steel, #333); color: var(--paper, #fff); padding: 8px 16px;
    border-radius: 4px; font-family: 'Oswald', sans-serif; text-transform: uppercase;
    font-size: 0.85rem; text-decoration: none; transition: border-color 0.15s ease;
  }
  .back-btn:hover { border-color: var(--blue-bright, #00d2ff); color: var(--blue-bright, #00d2ff); }
  .product-img-box {
    background: var(--panel-2, #181b20); border: 1px solid var(--steel, #333);
    border-radius: 8px; padding: 24px; display: flex; align-items: center; justify-content: center;
  }
  .product-img-box img { width: 100%; max-height: 450px; object-fit: contain; }
  .p-sku { font-family: 'JetBrains Mono', monospace; color: var(--blue-bright, #00d2ff); font-size: 0.85rem; }
  .p-title { font-family: 'Oswald', sans-serif; font-size: 2rem; margin: 8px 0 12px 0; color: #fff; text-transform: uppercase; }
  .p-price { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 16px; }
  .swatch-btn {
    padding: 8px 16px; background: var(--panel-2); border: 1px solid var(--steel);
    color: #fff; border-radius: 4px; font-size: 0.85rem; cursor: pointer;
  }
  .swatch-btn.active { border-color: var(--blue-bright) !important; color: var(--blue-bright) !important; font-weight: bold; }
  .add-cart-btn {
    width: 100%; padding: 14px; background: var(--blue, #00d2ff); color: #000;
    border: none; border-radius: 6px; font-family: 'Oswald', sans-serif; font-size: 1.1rem;
    text-transform: uppercase; font-weight: 700; cursor: pointer; margin-top: 24px;
  }
</style>
</head>
<body>

<nav>
  <div class="logo"><a href="index.html" style="color:inherit; text-decoration:none;">MURNAN <span>AUTO</span></a></div>
  <ul class="cat-nav" style="display:flex; align-items:center;">
    <li><a href="index.html#shop">Shop</a></li>
    <li>
      <button onclick="toggleCart()" style="background:var(--steel); border:1px solid var(--paper-dim); color:var(--paper); padding:6px 14px; font-family:'JetBrains Mono',monospace; font-size:0.8rem; text-transform:uppercase; cursor:pointer;">
        Cart (<span id="cart-count">0</span>)
      </button>
    </li>
  </ul>
</nav>

<!-- DEDICATED BACK BUTTON -->
<div class="back-nav-bar">
  <a href="javascript:history.back()" class="back-btn">&larr; Back to Shop</a>
</div>

<div class="product-page-container" id="product-root">
  <div style="grid-column: 1/-1; text-align: center; color: var(--paper-dim); padding: 60px 0;">
    Loading product information...
  </div>
</div>

<script src="cart.js"></script>
<script>
  let currentProduct = null;
  let selectedVariant = null;

  async function initProductPage() {
    await loadInventory();
    updateCartUI();

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    if (!productId || !window.inventory) return;

    currentProduct = inventory.find(p => p.id === productId || p.sku === productId);
    if (currentProduct) renderProduct();
  }

  function renderProduct() {
    const hasVariants = currentProduct.variants && currentProduct.variants.length > 0;
    if (hasVariants) selectedVariant = currentProduct.variants[0];

    const defaultImg = selectedVariant && selectedVariant.image ? selectedVariant.image : (currentProduct.image || '');
    const defaultSku = selectedVariant && selectedVariant.sku ? selectedVariant.sku : currentProduct.sku;
    const defaultPrice = selectedVariant && selectedVariant.price ? selectedVariant.price : currentProduct.price;

    let swatchesHtml = '';
    if (hasVariants) {
      swatchesHtml = `
        <div style="margin: 20px 0;">
          <div style="font-family:'JetBrains Mono',monospace; font-size: 0.8rem; color: #888; margin-bottom: 8px;">SELECT COLOR: <span id="color-name" style="color:#fff;">${selectedVariant.name}</span></div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            ${currentProduct.variants.map((v, idx) => `
              <button class="swatch-btn ${idx === 0 ? 'active' : ''}" onclick="switchVariant('${v.name.replace(/'/g, "\\'")}', this)">
                ${v.name}
              </button>
            `).join('')}
          </div>
        </div>`;
    }

    document.getElementById('product-root').innerHTML = `
      <div class="product-img-box">
        <img id="main-prod-img" src="${defaultImg}" alt="${currentProduct.name}">
      </div>
      <div>
        <span class="p-sku" id="main-prod-sku">${defaultSku}</span>
        <h1 class="p-title">${currentProduct.name}</h1>
        <div class="p-price" id="main-prod-price">$${defaultPrice.toFixed(2)}</div>
        ${swatchesHtml}
        <button class="add-cart-btn" onclick="handleAddToCart()">Add To Cart</button>
        <div style="margin-top: 30px; border-top: 1px solid var(--steel); padding-top: 20px; color: #aaa;">
          <p>${currentProduct.description || 'High-performance automotive plumbing component.'}</p>
        </div>
      </div>`;
  }

  function switchVariant(colorName, btnElem) {
    if (!currentProduct || !currentProduct.variants) return;
    const variant = currentProduct.variants.find(v => v.name === colorName);
    if (!variant) return;

    selectedVariant = variant;
    if (variant.image) document.getElementById('main-prod-img').src = variant.image;
    if (variant.sku) document.getElementById('main-prod-sku').innerText = variant.sku;
    if (variant.price) document.getElementById('main-prod-price').innerText = `$${variant.price.toFixed(2)}`;
    document.getElementById('color-name').innerText = variant.name;

    document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
    if (btnElem) btnElem.classList.add('active');
  }

  function handleAddToCart() {
    if (!currentProduct) return;
    if (selectedVariant) {
      addToCart(currentProduct.id, { option: selectedVariant.name, sku: selectedVariant.sku, price: selectedVariant.price });
    } else {
      addToCart(currentProduct.id);
    }
  }

  document.addEventListener('DOMContentLoaded', initProductPage);
</script>
</body>
</html>
