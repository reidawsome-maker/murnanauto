<script src="cart.js"></script>
<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function renderProduct(product) {
    const wrap = document.getElementById('productWrap');
    if (!wrap) return;

    if (!product) {
      wrap.innerHTML = `<div style="grid-column:1/-1; padding:40px 0; text-align:center; color:var(--paper-dim);">
        Product not found. <a href="index.html#shop" style="color:var(--blue-bright);">Return to shop</a>.
      </div>`;
      return;
    }

    const hasVariants = product.variants && product.variants.length > 0;
    let activeItem = hasVariants ? product.variants[0] : product;

    document.title = `${product.name} — Murnan Auto`;

    function buildVariantOptions() {
      if (!hasVariants) return '';
      return product.variants.map((v, idx) => {
        const optName = v.option || `Option ${idx + 1}`;
        const optPrice = v.price !== undefined ? parseFloat(v.price) : (parseFloat(product.price) || 0);
        return `<option value="${idx}">${optName} — $${optPrice.toFixed(2)}</option>`;
      }).join('');
    }

    function updateDisplay() {
      const currentPrice = parseFloat(activeItem.price !== undefined ? activeItem.price : product.price) || 0;
      const currentStock = parseInt(activeItem.stock !== undefined ? activeItem.stock : product.stock, 10) || 0;
      const inStock = currentStock > 0;

      const priceEl = document.getElementById('displayPrice');
      const skuEl = document.getElementById('displaySku');
      const stockEl = document.getElementById('displayStock');
      const buyBtn = document.getElementById('buyBtn');
      const qtyWrapper = document.getElementById('qtyWrapper');

      if (priceEl) priceEl.textContent = `$${currentPrice.toFixed(2)}`;
      if (skuEl) skuEl.textContent = activeItem.sku || product.sku || product.id;

      if (stockEl) {
        stockEl.textContent = inStock ? 'In Stock' : 'Out of Stock';
        stockEl.style.color = inStock ? '#4ADE80' : '#ff5c5c';
      }

      if (buyBtn) {
        buyBtn.disabled = !inStock;
        buyBtn.textContent = inStock ? 'Add to Cart' : 'Out of Stock';
      }

      if (qtyWrapper) {
        if (inStock) {
          qtyWrapper.style.display = 'flex';
          const qtySelect = document.getElementById('qtySelect');
          if (qtySelect) {
            let opts = '';
            const maxQty = Math.min(currentStock, 10);
            for (let i = 1; i <= maxQty; i++) opts += `<option value="${i}">${i}</option>`;
            qtySelect.innerHTML = opts;
          }
        } else {
          qtyWrapper.style.display = 'none';
        }
      }
    }

    wrap.innerHTML = `
      <div class="product-img">
        ${product.image ? `<img src="${product.image}" alt="${product.name}">` : 'IMAGE PENDING'}
      </div>
      <div>
        <span class="product-sku" id="displaySku">${activeItem.sku || product.sku || product.id}</span>
        <h1 class="product-title">${product.name}</h1>
        <div class="product-price" id="displayPrice">$${parseFloat(activeItem.price || product.price || 0).toFixed(2)}</div>
        <div class="product-stock" id="displayStock"></div>

        ${hasVariants ? `
          <div style="margin-bottom: 20px;">
            <label style="font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--paper-dim); display:block; margin-bottom:6px;">OPTION / SIZE</label>
            <select id="variantSelect" class="variant-select" style="width:100%; max-width:320px; cursor:pointer;">
              ${buildVariantOptions()}
            </select>
          </div>
        ` : ''}

        <div class="product-qty" id="qtyWrapper">
          <label for="qtySelect" style="font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--paper-dim);">QTY</label>
          <select id="qtySelect"><option value="1">1</option></select>
        </div>

        <button class="product-buy-btn" id="buyBtn">Add to Cart</button>

        <div class="product-desc">
          <p>Category: ${product.category || 'Uncategorized'}</p>
          ${product.description ? `<p style="margin-top:14px; color:var(--paper);">${product.description}</p>` : ''}
          ${product.specs ? `
            <div style="margin-top:20px; background:var(--panel); border:1px solid var(--steel); border-radius:8px; padding:20px;">
              <div style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--blue-bright); text-transform:uppercase; margin-bottom:10px;">Specs</div>
              <ul style="list-style:none; padding:0; margin:0; display:grid; gap:6px;">
                ${product.specs.map(s => `<li style="font-size:0.88rem; color:var(--paper-dim);">${s}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
          ${product.recommendation ? `
            <div style="margin-top:16px; background:rgba(47,111,232,0.1); border:1px solid var(--blue-dim); border-radius:8px; padding:20px;">
              <div style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--blue-bright); text-transform:uppercase; margin-bottom:10px;">We Recommend This For</div>
              <p style="font-size:0.9rem; color:var(--paper);">${product.recommendation}</p>
            </div>
          ` : ''}
          <p style="margin-top:18px;">These are general sizing guidelines, not a guarantee of fitment for every build.</p>
        </div>
      </div>
    `;

    updateDisplay();

    if (hasVariants) {
      const vSelect = document.getElementById('variantSelect');
      if (vSelect) {
        vSelect.addEventListener('change', (e) => {
          activeItem = product.variants[e.target.value];
          updateDisplay();
        });
      }
    }

    const buyBtn = document.getElementById('buyBtn');
    if (buyBtn) {
      buyBtn.addEventListener('click', () => {
        const qtySelect = document.getElementById('qtySelect');
        const qty = qtySelect ? parseInt(qtySelect.value, 10) : 1;
        const selectedSku = activeItem.sku || product.id;
        const selectedName = hasVariants ? `${product.name} (${activeItem.option || 'Selected Option'})` : product.name;
        const selectedPrice = parseFloat(activeItem.price !== undefined ? activeItem.price : product.price) || 0;

        const existing = cart.find(item => item.id === selectedSku);
        if (existing) {
          existing.qty += qty;
        } else {
          cart.push({ id: selectedSku, name: selectedName, price: selectedPrice, qty: qty });
        }
        saveCart();
        toggleCart();
      });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadInventory().then((products) => {
      const queryId = getParam('id');
      const product = products.find(p => 
        p.id === queryId || 
        p.sku === queryId || 
        (p.variants && p.variants.some(v => v.sku === queryId))
      );
      renderProduct(product);
      updateCartUI();
    });
  });
</script>
